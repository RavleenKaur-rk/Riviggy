<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="none"/>
  
  <!-- Green circle (people background) -->
  <circle cx="150" cy="120" r="35" fill="#2d7d4a"/>
  <circle cx="256" cy="80" r="40" fill="#2d7d4a"/>
  <circle cx="362" cy="120" r="35" fill="#2d7d4a"/>
  
  <!-- Green curved arms connecting people -->
  <path d="M 220 180 Q 150 200 120 280 Q 110 320 130 360 Q 160 380 220 360" 
        stroke="#2d7d4a" stroke-width="35" fill="none" stroke-linecap="round"/>
  <path d="M 292 180 Q 362 200 392 280 Q 402 320 382 360 Q 350 380 292 360" 
        stroke="#2d7d4a" stroke-width="35" fill="none" stroke-linecap="round"/>
  
  <!-- Orange plate/bowl background -->
  <path d="M 150 280 Q 150 200 256 180 Q 362 200 362 280 L 362 380 Q 362 420 256 430 Q 150 420 150 380 Z" 
        fill="#ff8c42"/>
  
  <!-- Fork -->
  <g transform="translate(256, 280)">
    <!-- Fork handle -->
    <rect x="-12" y="20" width="24" height="80" rx="12" fill="white"/>
    <!-- Fork prongs -->
    <rect x="-45" y="-40" width="18" height="80" rx="9" fill="white"/>
    <rect x="-12" y="-40" width="18" height="80" rx="9" fill="white"/>
    <rect x="27" y="-40" width="18" height="80" rx="9" fill="white"/>
  </g>
</svg>
